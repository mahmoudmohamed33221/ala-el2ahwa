<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E1B10">
<meta name="description" content="ع القهوة - منصة الألعاب الشعبية: دومينو، طاولة، ورق وأكتر">
<title>ع القهوة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#2A1810; --wood:#5C3A21; --wood-light:#7A4E2E;
    --ivory:#FBF6EC; --ink:#262019;
    --brass:#C89B3C; --brass-light:#E4C878; --brass-dark:#8f6e26;
    --text-light:#F1E7D6; --text-muted:#c9b79a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at 50% -10%, var(--wood-light) 0%, var(--wood) 40%, var(--wood-dark) 100%);
    color:var(--text-light); font-family:'Cairo', sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; align-items:center;
        padding: max(28px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .hub-icon{ width:150px; height:150px; border-radius:34px; box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 0 2px var(--brass-dark); margin-bottom:16px; }
  .brand-tag{ font-size:15px; color:var(--brass-light); margin:0 0 30px; font-weight:700; text-align:center; line-height:1.6; }

  .games-grid{ width:100%; max-width:420px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .game-card{
    position:relative; display:block; aspect-ratio:1/1; text-decoration:none; overflow:hidden;
    border:1px solid var(--brass-dark); border-radius:18px;
    box-shadow: 0 3px 10px rgba(0,0,0,.4);
  }
  .game-card:active{ transform:translateY(1px); }
  .game-card .thumb{ position:absolute; inset:0; background-size:cover; background-position:center;
                      display:flex; align-items:center; justify-content:center; font-size:64px; }
  .game-card .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .game-card .caption{ position:absolute; left:0; right:0; bottom:0; padding:22px 8px 10px; text-align:center;
                        background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.78) 75%); }
  .game-card .name{ font-weight:800; font-size:16px; color:#fff; margin:0; text-shadow:0 1px 3px rgba(0,0,0,.7); }

  .game-card.soon{ opacity:.75; pointer-events:none; }
  .game-card.soon .badge{ display:inline-block; margin-top:4px; font-size:10px; background:rgba(0,0,0,.5); border:1px solid var(--brass-dark); border-radius:20px; padding:2px 8px; color:var(--text-muted); }

  .hub-footer{ margin-top:auto; padding-top:30px; text-align:center; }
  .hub-footer .line{ width:50px; height:2px; background:var(--brass-dark); margin:0 auto; }
</style>
</head>
<body>
<div id="app">
  <img class="hub-icon" src="icons/icon-192.png" alt="ع القهوة">
  <p class="brand-tag">استعد لتحدي حقيقي بين الأصحاب…<br>مين هيكسب الليلة دي؟</p>

  <div class="games-grid">
    <a class="game-card" href="games/domino/index.html">
      <div class="thumb"><img src="icons/games/domino.png" alt="دومينو"></div>
      <div class="caption"><p class="name">دومينو</p></div>
    </a>

    <div class="game-card soon">
      <div class="thumb" style="background:linear-gradient(155deg,#7A4E2E,#3e2515);">🎲</div>
      <div class="caption">
        <p class="name">طاولة</p>
        <span class="badge">قريبًا</span>
      </div>
    </div>

    <div class="game-card soon">
      <div class="thumb" style="background:linear-gradient(155deg,#B85242,#5c2318);">🃏</div>
      <div class="caption">
        <p class="name">ورق</p>
        <span class="badge">قريبًا</span>
      </div>
    </div>
  </div>

  <div class="hub-footer">
    <div class="line"></div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js', { scope: './' }).catch(()=>{});
  });
}
</script>
</body>
</html>
